name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Run verification checks
        run: corepack pnpm check

      - name: Audit production dependencies
        if: success() || failure()
        run: corepack pnpm audit --prod --audit-level high

      - name: Verify Compose config
        if: success() || failure()
        env:
          POSTGRES_USER: ci_validation_user
          POSTGRES_PASSWORD: ci_validation_password
          POSTGRES_DB: ci_validation_db
        run: docker compose config --quiet

      - name: Verify infrastructure pins
        if: success() || failure()
        run: corepack pnpm verify:infrastructure-pins

  security_scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install checksum-pinned Trivy
        run: |
          set -euo pipefail

          if [ "$(uname -s)" != "Linux" ] || [ "$(uname -m)" != "x86_64" ]; then
            echo "Unsupported platform: $(uname -s) $(uname -m). Only Linux x86_64 is supported." >&2
            exit 1
          fi

          TRIVY_VERSION="0.76.1"
          EXPECTED_SHA256="c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
          ARCHIVE_NAME="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          DOWNLOAD_URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${ARCHIVE_NAME}"

          STAGING_DIR="$(mktemp -d "${RUNNER_TEMP}/trivy-staging.XXXXXX")"
          trap 'rm -rf "${STAGING_DIR}"' EXIT

          ARCHIVE_PATH="${STAGING_DIR}/${ARCHIVE_NAME}"

          curl --fail --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --tlsv1.2 \
            --retry 3 --retry-delay 2 --retry-connrefused \
            --output "${ARCHIVE_PATH}" \
            "${DOWNLOAD_URL}"

          echo "${EXPECTED_SHA256}  ${ARCHIVE_PATH}" | sha256sum --check --strict

          INSTALL_DIR="${RUNNER_TEMP}/trivy-bin"
          mkdir -p "${INSTALL_DIR}"

          tar -xzf "${ARCHIVE_PATH}" -C "${STAGING_DIR}" trivy
          install -m 0755 "${STAGING_DIR}/trivy" "${INSTALL_DIR}/trivy"

          echo "${INSTALL_DIR}" >> "${GITHUB_PATH}"

      - name: Verify Trivy version
        run: |
          TRIVY_VERSION=$(trivy --version | head -n 1)
          echo "Detected $TRIVY_VERSION"
          if [ "$TRIVY_VERSION" != "Version: 0.76.1" ]; then
            echo "Unexpected Trivy version: $TRIVY_VERSION" >&2
            exit 1
          fi

      - name: Verify security exception policy
        run: node scripts/verify-trivy-exception.mjs

      - name: Run container vulnerability scan
        timeout-minutes: 15
        env:
          POSTGRES_IMAGE: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        run: |
          trivy image --scanners vuln --timeout 10m --no-progress --format table --severity HIGH,CRITICAL --exit-code 0 --ignorefile .trivyignore.yaml --show-suppressed "$POSTGRES_IMAGE"
          trivy image --scanners vuln --timeout 10m --no-progress --format table --severity CRITICAL --ignore-unfixed --exit-code 1 --ignorefile .trivyignore.yaml --show-suppressed "$POSTGRES_IMAGE"

  postgres_integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
          POSTGRES_USER: acos_ci_user
          POSTGRES_PASSWORD: acos_ci_password_only
          POSTGRES_DB: acos_ci_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acos_ci_user -d acos_ci_dev"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s
    env:
      CI: 'true'
      NODE_ENV: test
      LOG_LEVEL: info
      DATABASE_URL: postgresql://acos_ci_user:acos_ci_password_only@127.0.0.1:5432/acos_ci_dev
      MIGRATION_DATABASE_URL: postgresql://acos_ci_user:acos_ci_password_only@127.0.0.1:5432/acos_ci_dev
      TEST_DATABASE_ADMIN_URL: postgresql://acos_ci_user:acos_ci_password_only@127.0.0.1:5432/postgres
      TEST_DATABASE_DISPOSABLE: YES_I_UNDERSTAND_TEST_DATABASES_WILL_BE_DROPPED
      DATABASE_SSL_MODE: disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Build workspace
        run: corepack pnpm build

      - name: Validate migrations from clean database
        run: corepack pnpm db:migrate:validate

      - name: Run PostgreSQL integration tests
        run: corepack pnpm test:integration
