name: affiliate-content-os

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    container_name: acos_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acos_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acos_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-acos_dev}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - acos_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-acos_local} -d $${POSTGRES_DB:-acos_dev}']
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  acos_postgres_data:
    name: acos_postgres_data
